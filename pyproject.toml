[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zzy-language"
version = "0.1.0a3"
description = "ZZY language: P01 tree-walk interpreter with run/check CLI"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = []

[project.scripts]
zzy = "zzy.cli:main"

[tool.setuptools.packages.find]
include = ["zzy*"]
