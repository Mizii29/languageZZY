[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zzy-language"
version = "0.6.0a1"
description = "ZZY AST interpreter with run/check/test CLI and staged sketch extension"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = []

[project.scripts]
zzy = "zzy.cli:main"

[tool.setuptools.packages.find]
include = ["zzy*"]
