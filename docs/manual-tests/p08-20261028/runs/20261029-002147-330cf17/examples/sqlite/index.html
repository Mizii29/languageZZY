<!doctype html><html lang="zh"><meta charset="utf-8"><title>ZZY SQLite 任务</title><h1>ZZY SQLite 任务</h1><label>任务标题 <input id="title" maxlength="80"></label><button id="add">添加</button><button id="refresh">刷新</button><pre id="result" role="status"></pre><script>
async function request(add=false){try{const response=await fetch('/api/tasks',add?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#title').value})}:{});const data=await response.json();document.querySelector('#result').textContent=(response.ok?'':'请求失败 '+response.status+'：')+JSON.stringify(data,null,2);}catch(e){document.querySelector('#result').textContent='连接失败，请确认服务已启动';}}
document.querySelector('#add').onclick=()=>request(true);document.querySelector('#refresh').onclick=()=>request();request();</script></html>
